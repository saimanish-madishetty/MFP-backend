# Local development database. Production uses Supabase Postgres.
services:
  postgres:
    image: postgres:17-alpine
    container_name: mfp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mfp
      POSTGRES_PASSWORD: mfp
      POSTGRES_DB: mfp
    ports:
      - "5432:5432"
    volumes:
      - mfp-pgdata:/var/lib/postgresql/data

volumes:
  mfp-pgdata:
